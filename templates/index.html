<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="{{ url_for('static', filename='logo.ico') }}">
  <title>Source's Stream Tool</title>
  <style>
    body {
      background-color: #111;
      color: white;
      font-family: sans-serif;
      padding: 10px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: auto auto auto auto;
      gap: 0px;
      align-items: center;
      margin-bottom: 10px;
    }

    select {
      padding: 5px;
      width: 120px;
      background-color: #222;
      border: 1px solid #555;
      color: white;
    }  

    input[type="text"] {
      padding: 5px;
      width: 120px;
      background-color: #222;
      border: 1px solid #555;
      color: white;
      font-size: 14px;
    }  

    input[type="number"] {
      padding: 5px;
      width: 30px;
      background-color: #222;
      border: 1px solid #555;
      color: white;
    }

    .section {
      margin-bottom: 10px;
    }

    button {
      padding: 6px 12px;
      color: white;
      background-color: #009905;
      border: 1px solid rgb(190, 190, 190);
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background-color: #006203;
    }

    .centered-row {
      display: flex;
      justify-content: center;
      margin: 10px 0;
    }

    .red-button {
      background-color: rgb(177, 0, 0);
    }

    .red-button:hover{
      background-color: rgb(109, 0, 0);
    }

    .wait-button {
      padding: 5px;
      background-color: #160094;
      
    }

    .wait-button:hover{
      background-color: #0d0057;
    }

  </style>

</head>
<body>
  
  <!-- Event Name -->
  <div class="centered-row">
    <input type="text" style="width: 200px; text-align: center;" id="event" placeholder="Event Name" value="{{ event }}">
  </div>

  <br>

  <!-- Round and Best Of -->
  <div class="centered-row">
    <!--body>Round</body-->
    <input type="text" style="width: 200px; text-align: center;" id="round" placeholder="Round" value="{{ round }}">
  </div>

  <br>
  
  <!-- Host Names -->
  <div class="centered-row">
    <!--label>Host Name</label-->
    <input type="text" id="host" placeholder="Host Name" min="0" value="{{ hostname }}">
  </div>

  <br>

  <!-- Player 1 Name + Score -->
  <div class="centered-row">
    <!--label>P1 Nametag</label-->
    <input type="text" id="player1" placeholder="Player 1" min="0" value="{{ player1 }}">
    <!--label>P1 Score</label-->
    <input type="number" id="score1" value="{{ score1 }}">
  </div>

  <!-- Player 2 Name + Score -->
  <div class="centered-row">
    <!--label>P2 Nametag</label-->
    <input type="text" id="player2" placeholder="Player 2" min="0" value="{{ player2 }}">
    <!--label>P2 Score</label-->
    <input type="number" id="score2" value="{{ score2 }}">
  </div>

  <!-- Player 3 Name + Score -->
  <div class="centered-row">
    <!--label>P3 Nametag</label-->
    <input type="text" id="player3" placeholder="Player 3" min="0" value="{{ player3 }}">
    <!--label>P3 Score</label-->
    <input type="number" id="score3" value="{{ score3 }}">
  </div>

  <!-- Player 4 Name + Score -->
  <div class="centered-row">
    <!--label>P4 Nametag</label-->
    <input type="text" id="player4" placeholder="Player 4" min="0" value="{{ player4 }}">
    <!--label>P4 Score</label-->
    <input type="number" id="score4" value="{{ score4 }}">
  </div>

  <br>

     <!-- Waiting Screen Text -->
  <div style="text-align: center;">
    <input type="text" style="width: 300px; text-align: center;" id="wait1" placeholder="Waiting Screen Text" value="{{ wait1 }}">
    <br>
    <button class="wait-button" style="width: 101px" id="wait1_1" onclick="setWait(id)">Stream Start</button>
    <button class="wait-button" style="width: 101px" id="wait1_2" onclick="setWait(id)">Stream Wait</button>
    <button class="wait-button" style="width: 101px" id="wait1_3" onclick="setWait(id)">Stream End</button>
    <br>
    <button class="wait-button" style="width: 154px" id="wait1_4" onclick="setWait(id)">Tech Issue</button>
    <button class="wait-button" style="width: 154px" id="wait1_5" onclick="setWait(id)">Up Next</button>

  </div>
  
  <br>

  <!-- Update Button -->
  <div class="centered-row">
    <button onclick="saveData()">Update Data</button>
  </div>

  <br>

  <!-- Reset Button -->
  <div class="centered-row">
    <button class="red-button" onclick="resetAll()">Reset All</button>
  </div>

  <script>
    function getField(id) {
      return document.getElementById(id).value;
    }

    function setField(id, val) {
      document.getElementById(id).value = val;
    }

    function swapPlayers() {
      const name1 = getField('player1');
      const name2 = getField('player2');
      const score1 = getField('score1');
      const score2 = getField('score2');
      setField('player1', name2);
      setField('player2', name1);
      setField('score1', score2);
      setField('score2', score1);
    }

    function setWait(id) {
      switch(id) {
        case "wait1_1":
          setField('wait1', "The stream will begin shortly");
          break;

        case "wait1_2":
          setField('wait1', "We'll be right back");
          break;

        case "wait1_3":
          setField('wait1', "Thanks for watching");
          break;

        case "wait1_4":
          setField('wait1', "Technical difficulties");
          break;

        case "wait1_5":
          setField('wait1', "Up next: ");
          break;

      }
    }

    function resetScores() {
      setField('score1', 0);
      setField('score2', 0);
    }

    function resetAll() {
      setField('player1', "Player 1");
      setField('player2', "Player 2");
      setField('score1', 0);
      setField('score2', 0);
      setField('commentator1', "Commentator 1");
      setField('commentator2', "Commentator 2");
      setField('round', "Winners Round 1");
      setField('tournament', "Tournament Name");
      setField('lowerthird', "Lower Third Text");
      setField('wait1', "Waiting Screen Text");
      setField('bestof', 3);
    }
    
    function swapCommentators() {
      const comm1 = getField('commentator1');
      const comm2 = getField('commentator2');
      setField('commentator1', comm2);
      setField('commentator2', comm1);
    }

    function saveData() {
      const data = {
        player1: getField('player1'),
        player2: getField('player2'),
        score1: getField('score1'),
        score2: getField('score2'),
        commentator1: getField('commentator1'),
        commentator2: getField('commentator2'),
        round: getField('round'),
        tournament: getField('tournament'),
        lowerthird: getField('lowerthird'),
        wait1: getField('wait1'),
        bestof: getField('bestof')
      };

      fetch('/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => {
        if (!res.ok) throw new Error("Failed to save");
      })
      .catch(err => alert("Error saving data"));
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveData();
      }
    });

    window.onload = function () {
      saveData();
    };
  </script>
</body>
</html>
